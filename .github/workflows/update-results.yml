name: Update official draw results
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/update-results.mjs'
      - 'scripts/hkjc-request.json'
      - 'scripts/generate-pages.mjs'
      - 'scripts/generate-portal.mjs'
      - 'search.js'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
      - 'config.js'
      - 'data-service.js'
      - 'scripts/test-update.mjs'
permissions:
  contents: write
concurrency:
  group: official-results-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official results
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-update.mjs
          node scripts/update-results.mjs 2>&1 | tee updater.log
      - name: Generate V3 SEO pages
        run: node scripts/generate-pages.mjs
      - name: Save verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/history.json draw number zodiac special machine archive index.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified HKJC draw results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
