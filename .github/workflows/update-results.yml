name: Update official draw results
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-results.mjs --test
      - run: node scripts/update-results.mjs
      - name: Save verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified HKJC draw results'
            git push
          fi
      - name: Prepare website
        run: |
          mkdir _site
          cp *.html *.js *.css manifest.webmanifest .nojekyll _site/
          cp -r data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
