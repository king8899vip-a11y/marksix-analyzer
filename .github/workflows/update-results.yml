name: Update official draw results
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/update-results.mjs'
      - 'scripts/hkjc-request.json'
      - 'scripts/generate-pages.mjs'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'sw.js'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-results-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official results
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/update-results.mjs
          node scripts/update-results.mjs 2>&1 | tee updater.log
      - name: Generate V3 SEO pages
        run: node scripts/generate-pages.mjs
      - name: Save verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json data/history.json draw number zodiac special machine sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified HKJC draw results'
            git push
          fi
      - name: Prepare website
        run: |
          mkdir _site
          cp *.html *.js *.css manifest.webmanifest .nojekyll _site/
          cp -r data _site/
          cp -r draw number zodiac special machine _site/
          cp sitemap.xml robots.txt _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for parallel Pages deployment
        run: sleep 75
      - uses: actions/deploy-pages@v4
        id: deployment
